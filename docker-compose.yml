services:
  mysql:
    image: mysql:8.0
    container_name: property-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: property_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: property-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  property-service:
    build:
      context: ./property-service
    container_name: property-service
    env_file:
      - ./property-service/.env
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  residents-mysql:
    image: mysql:8.0
    container_name: residents-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: residents_db
    ports:
      - "3307:3306"
    volumes:
      - residents_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  residents-service:
    build:
      context: ./residents-service
    container_name: residents-service
    restart: on-failure
    env_file:
      - ./residents-service/.env
    ports:
      - "3003:3003"
      - "50051:50051"
    depends_on:
      residents-mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: residents-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: residents_db
      MYSQL_PORT: 3306

  user-mysql:
    image: mysql:8.0
    container_name: user-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: user_service
    ports:
      - "3308:3306"
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    env_file:
      - ./user-service/.env
    ports:
      - "3005:3005"
    depends_on:
      user-mysql:
        condition: service_healthy

  web-gateway:
    build:
      context: ./web-gateway
    container_name: web-gateway
    environment:
      PORT: 4000
      USER_SERVICE_URL: http://user-service:3005
      PROPERTY_SERVICE_URL: http://property-service:3002
      RESIDENTS_SERVICE_URL: http://residents-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
    ports:
      - "4000:4000"
    depends_on:
      - user-service
      - property-service
      - residents-service

  payment-mongo:
    image: mongo:6
    container_name: payment-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - payment_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: payment-activemq
    restart: always
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - activemq_data:/opt/activemq/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:8161/admin >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    environment:
      MONGODB_URI: mongodb://payment-mongo:27017/payment-service
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      ACTIVEMQ_USER: admin
      ACTIVEMQ_PASSWORD: admin
    ports:
      - "3004:3004"
    depends_on:
      payment-mongo:
        condition: service_healthy
      activemq:
        condition: service_healthy

  mobile-gateway:
    build:
      context: ./mobile-gateway
    container_name: mobile-gateway
    environment:
      PORT: 4001
      PROPERTY_SERVICE_URL: http://property-service:3002
      RESIDENTS_SERVICE_URL: http://residents-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
    ports:
      - "4001:4001"
    depends_on:
      - property-service
      - residents-service
      - payment-service

volumes:
  mysql_data:
  rabbitmq_data:
  residents_mysql_data:
  payment_mongo_data:
  activemq_data:
  user_mysql_data:
