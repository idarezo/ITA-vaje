services:
  mysql:
    image: mysql:8.0
    container_name: property-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: property_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: property-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  property-service:
    build:
      context: ./property-service
    container_name: property-service
    env_file:
      - ./property-service/.env
    ports:
      - "3002:3002"
    depends_on:
      - mysql
      - rabbitmq

  residents-mysql:
    image: mysql:8.0
    container_name: residents-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: residents_db
    ports:
      - "3307:3306"
    volumes:
      - residents_mysql_data:/var/lib/mysql

  residents-service:
    build:
      context: ./residents-service
    container_name: residents-service
    env_file:
      - ./residents-service/.env
    ports:
      - "3003:3003"
      - "50051:50051"
    depends_on:
      - residents-mysql
    environment:
      MYSQL_HOST: residents-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: residents_db
      MYSQL_PORT: 3306

volumes:
  mysql_data:
  rabbitmq_data:
  residents_mysql_data:
