version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: property-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: property_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: property-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  property-service:
    build:
      context: ./property-service
    container_name: property-service
    env_file:
      - ./property-service/.env
    ports:
      - "3002:3002"
    depends_on:
      - mysql
      - rabbitmq

volumes:
  mysql_data:
  rabbitmq_data:
