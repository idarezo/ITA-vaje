apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: property-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: property-mysql
  template:
    metadata:
      labels:
        app: property-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: "property_db"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: property-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: property-mysql
spec:
  selector:
    app: property-mysql
  ports:
    - port: 3306
      targetPort: 3306
