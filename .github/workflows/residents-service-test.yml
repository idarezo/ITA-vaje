name: Residents Service Tests

on:
  push:
    branches: [main, master, develop, dev]
    paths:
      - "residents-service/**"
      - ".github/workflows/residents-service-test.yml"
  pull_request:
    branches: [main, master, develop, dev]
    paths:
      - "residents-service/**"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: ./residents-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "residents-service/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup environment (.env)
        run: |
          cat > .env << EOF
          API_PORT=3003
          MYSQL_HOST=127.0.0.1
          MYSQL_USER=root
          MYSQL_PASSWORD=password
          MYSQL_DATABASE=residents_db
          MYSQL_PORT=3306
          GRPC_PORT=50051
          ENVIRONMENT=development
          DEBUG=true
          EOF

      - name: Start Docker containers (residents-mysql only)
        run: |
          docker compose -f docker-compose.test.yml up -d residents-mysql
          sleep 15

      - name: Verify MySQL connection
        run: |
          timeout 30 bash -c 'until mysqladmin ping -h127.0.0.1 -P3307 -uroot -ppassword 2>/dev/null; do sleep 1; done'
        continue-on-error: true

      - name: Generate gRPC proto files
        run: python generate_proto.py

      - name: Run unit tests with pytest
        run: pytest test_api.py -v --tb=short

      - name: Run tests with coverage
        run: pytest test_api.py -v --cov=. --cov-report=xml --cov-report=html
        continue-on-error: true

      - name: Check API health
        run: |
          sleep 5
          curl -f http://localhost:3003/health || echo "Health check failed"
        continue-on-error: true

      - name: Check gRPC connectivity
        run: |
          python -c "
          import grpc
          channel = grpc.aio.insecure_channel('localhost:50051')
          print('gRPC channel created successfully')
          " 2>/dev/null || echo "gRPC channel check skipped (grpc not fully available)"
        continue-on-error: true

      - name: Display test results
        if: always()
        run: |
          echo "=== Docker Containers ==="
          docker ps -a
          echo ""
          echo "=== Docker Logs (residents-mysql) ==="
          docker logs residents-mysql 2>/dev/null | tail -20 || echo "No logs available"

      - name: Stop Docker containers
        if: always()
        run: |
          cd ..
          docker compose down -v --remove-orphans
          cd residents-service

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./residents-service/coverage.xml
          flags: residents-service
          name: residents-service-coverage
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: residents-service/htmlcov/
        continue-on-error: true
